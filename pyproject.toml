[project]
name = "cheatcv"
version = "0.1.0"
description = "Android game automation via ADB with CV pattern detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "adbutils>=2.0.0",
    "pynput>=1.7.6",
    "click>=8.0.0",
]

[project.scripts]
cheatcv = "cheatcv.cli:main"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "pylint>=3.0.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0103",  # Invalid name (allow short CV vars like x, y, img)
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
